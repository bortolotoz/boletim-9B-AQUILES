<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">9º Ano — 9B — Nº 03</p>
    </header>

    <!-- Tela de Acesso por PIN -->
    <section id="secao-login" class="card-login">
      <h2>Acesso ao Boletim</h2>
      <p class="login-info">Turma: <strong>9B</strong> | Chamada: <strong>03</strong></p>
      
      <div class="campo-login">
        <label for="input-pin">Digite seu PIN:</label>
        <input type="password" id="input-pin" placeholder="Seu PIN" autocomplete="off" />
      </div>

      <button id="btn-entrar" type="button" class="btn-primario">Entrar</button>
      <p id="msg-login" class="mensagem-status"></p>
    </section>

    <!-- Conteúdo do Boletim (Oculto até o login) -->
    <main id="secao-boletim" class="oculto">
      <!-- Painel de Ações do Aluno -->
      <div class="painel-acoes">
        <button id="btn-alterar-dados" type="button" class="btn-secundario">Alterar dados</button>
        <button id="btn-salvar-dados" type="button" class="btn-primario oculto">Salvar alterações</button>
        <button id="btn-cancelar-edicao" type="button" class="btn-cancelar oculto">Cancelar</button>
      </div>
      <p id="msg-edicao" class="mensagem-status"></p>

      <!-- Área de Cards de Resumo -->
      <section class="cards-grid">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="card-media-geral" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="card-total-faltas" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-desempenho" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Atenção</h3>
          <p id="card-atencao" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Frequência</h3>
          <p id="card-frequencia" class="card-valor">92%</p>
          <span class="card-subtexto">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela Responsiva de Disciplinas -->
      <section class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <!-- O corpo da tabela será preenchido automaticamente pelo JavaScript -->
          <tbody id="tabela-corpo">
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
